on:
  push:
  pull_request:
  workflow_dispatch:

name: R-CMD-test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: |
          install.packages(c("rlang", "testthat", "dplyr", "tidyr", "ggplot2", "shiny"),
                           repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Install package
        run: R CMD INSTALL .

      - name: Run tests
        run: |
          library(testthat)
          library(wwwforensic)
          test_dir("tests/testthat", reporter = "summary")
        shell: Rscript {0}
